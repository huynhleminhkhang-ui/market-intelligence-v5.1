name: Send Market Urgency Digest

on:
  schedule:
    - cron: "0 7,9,12,17 * * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Send filtered digest with Resend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          ALERT_RECIPIENTS: ${{ vars.ALERT_RECIPIENTS }}
          EMAIL_LOOKBACK_HOURS: "24"
          EMAIL_MAX_ARTICLES: "25"
        run: python jobs/send_digest.py
